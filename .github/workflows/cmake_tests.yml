name: CMake build
permissions:
  contents: read
jobs:
  cmake-checks:
    name: CMake checks
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller'
    - name: Mark the workspace as safe
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Check CMakeLists files
      run: 'which curl jq || apt -q update

        which curl || apt -yq install curl

        which jq || apt -yq install jq

        curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/update-cmake-lists.sh | CONFIG_JSON="$INPUT_UPDATE_CMAKE_LISTS_CONFIG"
        FAIL_ON_CHANGES=true bash

        '
      env:
        INPUT_UPDATE_CMAKE_LISTS_CONFIG: ${{ inputs.update_cmake_lists_config }}
    - name: CMake build
      run: 'which curl cmake ninja || apt -q update

        which curl || apt -yq install curl

        which cmake || apt -yq install cmake

        which ninja || apt -yq install ninja-build

        curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/cmake-build.sh | TARGET_DIRECTORY="$INPUT_CMAKE_BUILD_TARGET_DIRECTORY"
        CMAKE_VERSION="$INPUT_CMAKE_VERSION" bash

        '
      env:
        INPUT_CMAKE_BUILD_TARGET_DIRECTORY: ${{ inputs.cmake_build_target_directory }}
        INPUT_CMAKE_VERSION: ${{ inputs.cmake_version }}
'on':
  workflow_call:
    inputs:
      update_cmake_lists_config:
        type: string
        description: The configuration used when updating the CMake lists.
        required: true
      cmake_build_target_directory:
        type: string
        description: The directory to pass to `cmake build`.
        default: .
      cmake_version:
        type: string
        description: The version of CMake to install.
        default: ''
      image:
        type: string
        description: The docker image to run the checks in.
        default: swift:6.0-jammy
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-cmake_tests.yml-${{ inputs.name }}
  cancel-in-progress: false
