name: Windows CMake supported compiler preflight
permissions:
  contents: read
jobs:
  cmake-windows:
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.3']
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller'
    - name: Install verified CMake binary
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-windows-x86_64.zip -OutFile
        cmake.zip

        if ((Get-FileHash cmake.zip -Algorithm SHA256).Hash.ToLower() -ne ''b59a31dfbfa376a4aaea9ff560ff2b29f78ee5f9fb15447fc71ae7bf9fea9379'')
        { throw ''CMake digest mismatch'' }

        Expand-Archive cmake.zip cmake-dist

        Invoke-WebRequest https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip -OutFile ninja.zip

        if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash.ToLower() -ne ''07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'')
        { throw ''Ninja digest mismatch'' }

        Expand-Archive ninja.zip ninja-dist'
    - name: Build-tree and relocated static/shared Windows consumers
      shell: pwsh
      env:
        SMOKE: "$ErrorActionPreference = 'Stop'\n$env:PATH = 'C:\\work\\cmake-dist\\cmake-4.0.3-windows-x86_64\\bin;C:\\work\\\
          ninja-dist;' + $env:PATH\nfunction Run-CMake { & cmake @args; if ($LASTEXITCODE -ne 0) { throw \"cmake failed: $args\"\
          \ } }\nfunction Run-CTest { & ctest @args; if ($LASTEXITCODE -ne 0) { throw \"ctest failed: $args\" } }\nSet-Location\
          \ C:\\work\n$vswhere = 'C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe'\n$installation\
          \ = & $vswhere -latest -products '*' -property installationPath\nif ($LASTEXITCODE -ne 0 -or -not $installation)\
          \ { throw 'Visual Studio Build Tools unavailable' }\n$devcmd = Join-Path $installation 'Common7\\Tools\\VsDevCmd.bat'\n\
          if (-not (Test-Path $devcmd)) { throw 'VS developer environment unavailable' }\ncmd /c \"`\"$devcmd`\" -arch=amd64\
          \ -host_arch=amd64 >nul && set\" | ForEach-Object {\n  if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1],\
          \ $matches[2], 'Process') }\n}\n$swiftSearchPath = $env:PATH\n[Environment]::SetEnvironmentVariable('PATH', $null, 'Process')\n[Environment]::SetEnvironmentVariable('Path', $swiftSearchPath, 'Process')\nwhere.exe link\nif ($LASTEXITCODE -ne 0) { throw 'MSVC linker unavailable' }\nswift\
          \ --version\nif ($LASTEXITCODE -ne 0) { throw 'Swift unavailable' }\nforeach ($shared in @('OFF', 'ON')) {\n  foreach\
          \ ($generator in @('Ninja', 'Ninja Multi-Config')) {\n    $label = $shared + '-' + $generator.Replace(' ', '-')\n\
          \    $prefix = 'C:/work/check-' + $label + '/prefix'\n    Run-CMake -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug\
          \ -S . -B \"library-$label\" -G $generator -DCMAKE_BUILD_TYPE=Debug \"-DBUILD_SHARED_LIBS=$shared\" \"-DCMAKE_PREFIX_PATH=$prefix\"\
          \ \"-DCMAKE_INSTALL_PREFIX=$prefix\"\n    Run-CMake --build \"library-$label\" --config Debug\n    Run-CMake --install\
          \ \"library-$label\" --config Debug\n    Run-CMake -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -S Tests/CMake\
          \ -B \"consumer-build-$label\" -G $generator \"-DCMAKE_PREFIX_PATH=C:/work/library-$label;$prefix\"\n    Run-CMake\
          \ --build \"consumer-build-$label\" --config Debug\n    Run-CTest --test-dir \"consumer-build-$label\" -C Debug\
          \ --output-on-failure\n    Move-Item $prefix \"$prefix-moved\"\n    Run-CMake -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug\
          \ -S Tests/CMake -B \"consumer-install-$label\" -G $generator \"-DCMAKE_PREFIX_PATH=$prefix-moved\"\n    Run-CMake\
          \ --build \"consumer-install-$label\" --config Debug\n    Run-CTest --test-dir \"consumer-install-$label\" -C Debug\
          \ --output-on-failure\n  }\n}\n"
      run: "$ErrorActionPreference = 'Stop'\nSet-Content -Path cmake-smoke.ps1 -Value $env:SMOKE\n docker run --rm -v \"${env:GITHUB_WORKSPACE}:C:\\\
        work\" -w C:\\work swift:${{ matrix.swift }}-windowsservercore-ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass -File C:\\work\\\
        cmake-smoke.ps1\nif ($LASTEXITCODE -ne 0) { throw 'Windows CMake validation failed' }"
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
