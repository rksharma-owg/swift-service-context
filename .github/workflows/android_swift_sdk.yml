name: Android Swift SDK
permissions:
  contents: read
jobs:
  construct-matrix:
    name: Construct Android Swift SDK matrix
    runs-on: ubuntu-latest
    outputs:
      android-sdk-matrix: ${{ steps.generate-matrix.outputs.android-sdk-matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller'
    - id: generate-matrix
      run: "# Validate and use JSON environment variables directly\nenv_vars_json=\"$INPUT_ENV_VARS\"\n\n# Validate JSON format\n\
        if ! echo \"$env_vars_json\" | jq empty 2>/dev/null; then\n  echo \"Error: env_vars is not valid JSON\"\n  exit 1\n\
        fi\n\n# Generate matrix with parsed environment variables\ncat >> \"$GITHUB_OUTPUT\" << EOM\nandroid-sdk-matrix=$(echo\
        \ '{\n  \"config\":[\n    {\n      \"name\":\"main Jammy\",\n      \"swift_version\":\"main\",\n      \"platform\"\
        :\"Linux\",\n      \"runner\":\"ubuntu-latest\",\n      \"image\":\"ubuntu:jammy\",\n      \"setup_command\":\"apt\
        \ update -q && apt install -y -q curl jq tar && curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/install_swift_prerequisites.sh\
        \ | bash && curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/install_swift_sdk.sh\
        \ | INSTALL_SWIFT_BRANCH=main INSTALL_SWIFT_ARCH=x86_64 INSTALL_SWIFT_SDK=android-sdk bash && curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/install_android_ndk.sh\
        \ | bash && hash -r\",\n      \"command\":\"curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/swift-build-with-android-sdk.sh\
        \ | bash -s --\",\n      \"command_arguments\":\"'\"$INPUT_ADDITIONAL_COMMAND_ARGUMENTS\"'\",\n      \"env\":'\"$env_vars_json\"\
        '\n    }\n  ]\n}' | jq -c)\nEOM\n"
      env:
        INPUT_ENV_VARS: ${{ inputs.env_vars }}
        INPUT_ADDITIONAL_COMMAND_ARGUMENTS: ${{ inputs.additional_command_arguments }}
  android-swift-sdk:
    name: Android Swift SDK
    needs: construct-matrix
    uses: rksharma-owg/swift-service-context/.github/workflows/swift_test_matrix.yml@main
    with:
      name: Android Swift SDK
      matrix_string: ${{ needs.construct-matrix.outputs.android-sdk-matrix }}
'on':
  workflow_call:
    inputs:
      env_vars:
        type: string
        description: Environment variables for jobs as JSON (e.g., '{"DEBUG":"1","LOG_LEVEL":"info"}').
        default: '{}'
      additional_command_arguments:
        type: string
        description: Additional arguments passed to swift build (the Android Swift SDK will be specified). Defaults to empty.
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-android_swift_sdk.yml-${{ inputs.name }}
  cancel-in-progress: false
